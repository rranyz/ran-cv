# Continuous Integration: lint, type-check and production-build the site.
#
# Runs on pull requests targeting `main` / `develop` and on pushes to `develop`.
# It is also a reusable workflow: `nextjs.yml` calls it with
# `upload-pages-artifact: true` so a deployment always runs the exact same checks
# and ships the artifact produced by this job.
#
# All actions are pinned to full commit SHAs (version noted in the comment).
# Dependabot (.github/dependabot.yml) keeps these pins up to date.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload ./dist as the GitHub Pages artifact after a successful build.
        type: boolean
        required: false
        default: false

# Read-only token by default; nothing in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs for PRs and `develop`, but never cancel a run that is part
# of a deployment from `main` (when called by nextjs.yml, github.ref is main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Next.js incremental build cache. With `output: 'export'`, Next.js writes the
      # static site to `dist/` (distDir) but keeps its build cache in `.next/cache`.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.js') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx --no-install tsc --noEmit

      - name: Build static export
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
